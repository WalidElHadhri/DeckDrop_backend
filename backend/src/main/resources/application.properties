spring.application.name=deckdrop-backend
server.port=${SERVER_PORT:8080}

# PostgreSQL (default profile)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/deckdrop_db}
spring.datasource.username=${DB_USERNAME:walid}
spring.datasource.password=${DB_PASSWORD:1452}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.file.name=default.txt
